<style>
:root {
  --bg: #f8f9fc;
  --text: #1a1e2e;
  --text-dim: #5a6580;
  --primary: #3366ff;
  --border: #e4e8f0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1117;
    --text: #e4e8f0;
    --text-dim: #9aa0b8;
    --border: #2a2d3e;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1117;
  --text: #e4e8f0;
  --text-dim: #9aa0b8;
  --border: #2a2d3e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}
.code { font-size: 80px; font-weight: 700; color: var(--primary); line-height: 1; }
h1 { font-size: 22px; font-weight: 700; margin: 16px 0 12px; }
p { font-size: 15px; color: var(--text-dim); margin-bottom: 32px; }
.btn {
  display: inline-block;
  background: var(--primary);
  color: #fff;
  text-decoration: none;
  padding: 12px 32px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 15px;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.links { margin-top: 32px; font-size: 14px; }
.links a { color: var(--primary); text-decoration: none; margin: 0 12px; }
.links a:hover { text-decoration: underline; }
</style>
</head>
